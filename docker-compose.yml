# Local dev stack: `make up`, then hit http://localhost:8080
#   Grafana    http://localhost:3000 (admin / admin)
#   Prometheus http://localhost:9090
services:
  gateway:
    build: { context: ., args: { APP: gateway } }
    ports: ["8080:8080"]
    environment:
      PROVIDER_URL: http://mockllm:9000
      REDIS_ADDR: redis:6379
      RATE_LIMIT_PER_MIN: "100"
      CACHE_TTL_SECONDS: "300"
    depends_on: [mockllm, redis]
    deploy: { replicas: 1 }   # scale with: docker compose up --scale gateway=3 (remove ports mapping first)

  mockllm:
    build: { context: ., args: { APP: mockllm } }
    ports: ["9000:9000"]
    environment:
      LATENCY_MS_MEAN: "800"
      LATENCY_MS_JITTER: "300"
      RATE_LIMIT_RPS: "50"
      ERROR_RATE: "0.0"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
